name: Release

# Publish all @dream-machine/* packages + the dream-machine CLI to npm when a
# semver tag is pushed. Requires the NPM_TOKEN repo secret (an npm automation
# token with publish rights to the @dream-machine scope and the dream-machine
# package). Uses OIDC provenance.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - name: Publish in dependency order
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          for pkg in witness ledger compile schedule memory cli; do
            echo "::group::publish @ packages/$pkg"
            npm publish -w "packages/$pkg" --provenance --access public || {
              echo "publish failed for $pkg (already published at this version?)"; }
            echo "::endgroup::"
          done
      - name: Dry-run pack (no token needed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          for pkg in witness ledger compile schedule memory cli; do
            npm pack -w "packages/$pkg" --dry-run
          done
