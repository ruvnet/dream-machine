name: Release

# Publish all @dream-machine/* packages + the dream-machine CLI to npm when a
# semver tag is pushed. Requires the NPM_TOKEN repo secret (an npm automation
# token with publish rights to the @dream-machine scope and the dream-machine
# package). Uses OIDC provenance.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack only, do not publish'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      # The @dream-machine/* engine modules are bundled into the CLI (no npm org
      # scope), so we publish a single self-contained `dream-machine` package.
      - name: Prepare standalone CLI (bundle deps, rewrite manifest)
        run: node scripts/prepare-cli-publish.mjs
      - name: Publish dream-machine
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Tolerant: no token, or a version already on npm (e.g. released
        # manually), is a skip — not a failed release.
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN not set — skipping publish (release notes only)."; exit 0
          fi
          npm publish --provenance --access public || echo "publish skipped (version already on npm)"
      - name: Dry-run pack (no token needed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        working-directory: packages/cli
        run: npm pack --dry-run
