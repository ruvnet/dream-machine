name: Release
on:
  push:
    # Stable tags deliberately fail the helper policy until manually dispatched.
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Pack and test only (publishing requires selecting a matching version tag)'
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.pack.outputs.digest }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: npm }
      - run: git merge-base --is-ancestor HEAD origin/main
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: node scripts/prepare-cli-publish.mjs
      - name: Inspect and install exact release tarball
        id: pack
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          digest=$(node scripts/factory-release.mjs stage)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: npm-release-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Maintainers MUST configure required reviewers and tag restrictions here,
    # protect main with review/check requirements, and configure the matching
    # npm trusted publisher. Declaring an environment alone adds no protection.
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/factory-release.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-artifact
          merge-multiple: true
      - name: Publish exact verified bytes using npm trusted publishing
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: node scripts/factory-release.mjs publish "$EXPECTED_DIGEST"
