name: Human merge policy guard

# This legacy filename no longer grants merge authority. The base revision's
# configuration and policy are evaluated without executing pull request code.
# Even an eligible result requires a separate human review and merge decision.

on:
  pull_request_target:
    types: [labeled, unlabeled, opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Evaluate merge policy without merge authority
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/automerge-guard.mjs
