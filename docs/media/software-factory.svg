<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc"><title id="title">Dream Machine software factory</title><desc id="desc">Research becomes a measured candidate through a bounded review process.. Research, implement, measure, review, then release through a separate trusted workflow.</desc><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="100" y1="226" x2="900" y2="226"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs><style>.flow{stroke-dasharray:10 12;animation:travel 3s linear infinite}.pulse{animation:glow 4s ease-in-out infinite}@keyframes travel{to{stroke-dashoffset:-88}}@keyframes glow{50%{opacity:.5}}@media(prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><rect width="1000" height="400" rx="24" fill="#090d1b"/><rect x="1" y="1" width="998" height="398" rx="24" fill="none" stroke="#29304b"/><text x="48" y="57" fill="#22d3ee" font-family="sans-serif" font-size="13" letter-spacing="4">DREAM MACHINE / SOFTWARE FACTORY</text><text x="48" y="105" fill="#f1f5ff" font-family="sans-serif" font-size="29">Dream Machine software factory</text><text x="48" y="139" fill="#a7b0c9" font-family="sans-serif" font-size="16">Research becomes a measured candidate through a bounded review process.</text><path class="flow" d="M130 226H870" fill="none" stroke="url(#g)" stroke-width="3"/><g><rect x="50" y="191" width="155" height="70" rx="12" fill="#12192e" stroke="#7862cb"/><circle class="pulse" style="animation-delay:0s" cx="70" cy="214" r="3" fill="#22d3ee"/><text x="68" y="244" fill="#f1f5ff" font-family="sans-serif" font-size="18">Research</text></g><g><rect x="235" y="191" width="155" height="70" rx="12" fill="#12192e" stroke="#7862cb"/><circle class="pulse" style="animation-delay:0.6s" cx="255" cy="214" r="3" fill="#22d3ee"/><text x="253" y="244" fill="#f1f5ff" font-family="sans-serif" font-size="18">Implement</text></g><g><rect x="420" y="191" width="155" height="70" rx="12" fill="#12192e" stroke="#7862cb"/><circle class="pulse" style="animation-delay:1.2s" cx="440" cy="214" r="3" fill="#22d3ee"/><text x="438" y="244" fill="#f1f5ff" font-family="sans-serif" font-size="18">Measure</text></g><g><rect x="605" y="191" width="155" height="70" rx="12" fill="#12192e" stroke="#7862cb"/><circle class="pulse" style="animation-delay:1.7999999999999998s" cx="625" cy="214" r="3" fill="#22d3ee"/><text x="623" y="244" fill="#f1f5ff" font-family="sans-serif" font-size="18">Review</text></g><g><rect x="790" y="191" width="155" height="70" rx="12" fill="#12192e" stroke="#22d3ee"/><circle class="pulse" style="animation-delay:2.4s" cx="810" cy="214" r="3" fill="#22d3ee"/><text x="808" y="244" fill="#f1f5ff" font-family="sans-serif" font-size="18">Release</text></g><text x="48" y="313" fill="#a7b0c9" font-family="sans-serif" font-size="15">Baseline + held out evaluation + existing tests + provenance</text><text x="48" y="345" fill="#8de9ec" font-family="sans-serif" font-size="14">Draft PR → reviewed main → separate trusted publication</text><text x="48" y="376" fill="#7c879f" font-family="sans-serif" font-size="12">Conceptual process illustration. Not evidence of an executed release.</text></svg>